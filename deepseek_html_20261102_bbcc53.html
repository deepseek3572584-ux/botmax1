<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Моё мини-приложение</title>
  <!-- Подключаем MAX Bridge с официального CDN -->
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: #fff; font-weight: bold;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #1a1a1a; }
    p  { font-size: 15px; color: #666; line-height: 1.5; }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #999;
      padding: 8px 12px;
      background: #f0f0f0;
      border-radius: 10px;
    }
    .error { color: #e74c3c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar" id="avatar">?</div>
    <h1 id="greeting">Загрузка…</h1>
    <p id="subtitle">Мини-приложение в MAX</p>
    <div class="status" id="status">Проверяем окружение…</div>
  </div>

  <script>
    (function() {
      const avatarEl = document.getElementById('avatar');
      const greetingEl = document.getElementById('greeting');
      const subtitleEl = document.getElementById('subtitle');
      const statusEl = document.getElementById('status');

      // Проверяем, доступен ли объект WebApp (значит, мы внутри MAX)
      if (window.WebApp) {
        const app = window.WebApp;
        // Данные пользователя лежат в initDataUnsafe.user
        const user = app.initDataUnsafe?.user;

        if (user && user.first_name) {
          const name = user.first_name;
          greetingEl.textContent = `Привет, ${name}! 👋`;
          subtitleEl.textContent = 'Ты открыл мини-приложение внутри MAX.';
          avatarEl.textContent = name.charAt(0).toUpperCase();
          statusEl.textContent = '✅ MAX Bridge подключён';
        } else {
          greetingEl.textContent = 'Привет!';
          subtitleEl.textContent = 'Данные пользователя недоступны.';
          statusEl.textContent = '⚠️ WebApp есть, но user пуст';
        }
      } else {
        // Сценарий: страница открыта в обычном браузере (не в MAX)
        greetingEl.textContent = 'Привет, гость!';
        subtitleEl.textContent = 'Открой меня через бота в MAX, чтобы я узнал твоё имя.';
        statusEl.textContent = 'ℹ️ Открыто вне MAX (браузер)';
        statusEl.classList.add('error');
      }
    })();
  </script>
</body>
</html>
